services:
  # Placeholder for "soketi" overrides in a docker-compose.custom.yml carried over from an upstream
  # installation. Without this entry, such an override is an incomplete service and every upgrade fails.
  soketi:
    image: busybox:1.37
    deploy:
      replicas: 0
  coolify:
    image: "${REGISTRY_URL:-docker.io}/${COOLIFY_RS_IMAGE:-coolify-rs/coolify-rs}:${LATEST_IMAGE:-latest}"
    command: ["boot"]
    volumes:
      - /data/coolify/ssh:/data/coolify-rs/ssh
      - /data/coolify/images:/data/coolify-rs/images
    environment:
      - DB_HOST=postgres
      - COOLIFY_RS_SERVER_SCHEDULER=on
    env_file:
      - /data/coolify/source/.env
    ports:
      - "${APP_PORT:-8000}:8080"
    expose:
      - "${APP_PORT:-8000}"
    networks:
      coolify:
        # Realtime ran in the coolify-realtime container before upstream 4.4; existing proxy upstreams keep the name.
        aliases:
          - coolify-realtime
    healthcheck:
      test: ["CMD", "/usr/local/bin/coolify-rs", "healthcheck"]
      interval: 5s
      retries: 24
      start_period: 1m
      timeout: 3s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  postgres:
    volumes:
      - coolify-db:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: "${DB_USERNAME}"
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
      POSTGRES_DB: "${DB_DATABASE:-coolify}"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USERNAME}", "-d", "${DB_DATABASE:-coolify}" ]
      interval: 5s
      retries: 10
      timeout: 2s
  redis:
    command: redis-server --save 20 1 --loglevel warning --requirepass ${REDIS_PASSWORD}
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
    volumes:
      - coolify-redis:/data
    healthcheck:
      test: redis-cli ping
      interval: 5s
      retries: 10
      timeout: 2s
volumes:
  coolify-db:
    name: coolify-db
  coolify-redis:
    name: coolify-redis

networks:
  coolify:
    external: true
