[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/coolify-rs/coolify-rs" # provisional
publish = false

[workspace.dependencies]
coolify-domain = { path = "crates/coolify-domain" }
coolify-compat = { path = "crates/coolify-compat" }
coolify-db = { path = "crates/coolify-db" }
coolify-api = { path = "crates/coolify-api" }
coolify-port = { path = "crates/coolify-port" }
coolify-remote = { path = "crates/coolify-remote" }
coolify-jobs = { path = "crates/coolify-jobs" }
coolify-plugins = { path = "crates/coolify-plugins" }

anyhow = "1"
axum = { version = "0.8", features = ["multipart", "ws"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
chrono-tz = { version = "0.10", default-features = false, features = ["std"] }
clap = { version = "4", features = ["derive", "env"] }
hex = "0.4"
hmac = "0.12"
p256 = { version = "0.13", features = ["ecdsa", "pkcs8", "pem"] }
p384 = { version = "0.13", features = ["ecdsa", "pkcs8", "pem"] }
p521 = { version = "0.13", features = ["ecdsa", "pkcs8", "pem"] }
aes = "0.8"
cbc = { version = "0.1", features = ["std"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
regex = "1"
fancy-regex = "0.14"
argon2 = "0.5"
bcrypt = "0.19"
sha1 = "0.10"
md-5 = "0.10"
ssh-key = { version = "0.6", features = ["std", "ed25519", "rand_core"] }
rsa = { version = "0.9", features = ["std", "pem"] }
rand_core = "0.6"
sha2 = "0.10"
subtle = "2"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "json", "macros", "migrate"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "time", "process", "fs", "io-util", "sync"] }
toml = "0.8"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace", "request-id", "timeout", "cors", "limit", "fs", "set-header"] }
tracing = "0.1"
zeroize = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
http-body-util = "0.1"
reqwest = { version = "0.12.9", default-features = false, features = ["rustls-tls", "json"] }
wasmtime = "50"
wasmtime-wasi = "50"
lettre = { version = "0.11", default-features = false, features = ["builder", "hostname", "smtp-transport", "tokio1", "tokio1-rustls", "ring", "webpki-roots"] }
pulldown-cmark = { version = "0.13", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"
# Handlers return axum's `Response` as the error to short-circuit; boxing it buys nothing.
result_large_err = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
