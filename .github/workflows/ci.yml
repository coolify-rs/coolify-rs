name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: coolify_rs
          POSTGRES_PASSWORD: coolify_rs
          POSTGRES_DB: coolify_rs
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U coolify_rs -d coolify_rs"
          --health-interval 2s --health-retries 30
    env:
      COOLIFY_RS_TEST_DATABASE_URL: postgres://coolify_rs:coolify_rs@127.0.0.1:5432/coolify_rs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: SSH test host (remote execution and server validation tests)
        run: ./scripts/testing-host-up.sh
      - name: test (unit, integration, API contract against the upstream baseline schema)
        env:
          COOLIFY_RS_TEST_SSH: 127.0.0.1:2223
          COOLIFY_RS_TEST_SSH_KEY: ${{ github.workspace }}/compat/testing-host/secrets/id_ed25519
        run: cargo test --workspace --all-features --locked --no-fail-fast

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: type-check
        run: npm run check
      - run: npm run build
      - run: npm audit --audit-level=high

  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # A prebuilt cargo-audit: building it needs a newer Rust than the pinned toolchain.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # Reviewed exceptions are in .cargo/audit.toml.
      - run: cargo audit

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The gitleaks CLI; the gitleaks action needs a license for organization repositories.
      # Reviewed findings are allowed in .gitleaks.toml.
      - name: gitleaks
        run: docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 git /repo --redact --no-banner --config /repo/.gitleaks.toml

  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: build container image
        run: docker build -t coolify-rs:ci .

  # Weekly upstream tracking: analysis only (no generation, no credentials),
  # publishes the report as an artifact for human triage.
  upstream-analysis:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
      - uses: Swatinem/rust-cache@v2
      - name: mirror upstream (read-only)
        run: git clone --bare --filter=blob:none --no-single-branch https://github.com/coollabsio/coolify .upstream/coolify.git
      - name: analyse pending upstream commits
        run: cargo run -q -p coolify-port-cli --bin coolify-port -- run
      - uses: actions/upload-artifact@v4
        with:
          name: migration-report
          path: .migration-runs/*/report.*
