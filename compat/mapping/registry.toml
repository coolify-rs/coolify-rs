[[component]]
id = "api.private-keys"
title = "Private keys REST API"
status = "verified"
upstream.paths = ["app/Http/Controllers/Api/SecurityController.php", "app/Models/PrivateKey.php", "app/Policies/PrivateKeyPolicy.php"]
upstream.symbols = [
  "bootstrap/helpers/shared.php::formatPrivateKey()",
  "bootstrap/helpers/shared.php::generate_random_name()",
  "bootstrap/helpers/shared.php::customApiValidator()",
]
upstream.routes = ["GET api/v1/security/keys*", "POST api/v1/security/keys", "PATCH api/v1/security/keys/{uuid}", "DELETE api/v1/security/keys/{uuid}"]
upstream.tables = ["private_keys"]
upstream.tests = ["tests/Feature/Api/PrivateKey*Test.php", "tests/Feature/PrivateKeyFingerprintTeamScopeTest.php", "tests/Feature/Security/ApiSensitiveFieldsTest.php"]
rust.paths = ["crates/coolify-api/src/routes/private_keys.rs", "crates/coolify-db/src/private_keys.rs", "crates/coolify-compat/src/sshkey.rs"]
rust.tests = ["crates/coolify-api/tests/private_keys.rs", "crates/coolify-compat/tests/sshkey_interop.rs", "compat/diff/differential.py"]
rust.packages = ["coolify-api", "coolify-db", "coolify-compat"]
divergences = [
  "PuTTY and PKCS#8 EC keys are rejected (phpseclib accepts them)",
  "generated names use different words than nubs/random-name-generator",
  "invalid key on PATCH returns 422 JSON even without Accept: application/json (upstream redirects)",
  "keys are not written to storage/app/ssh/keys (upstream rewrites them before each SSH use)",
]

