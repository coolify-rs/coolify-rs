# coolify-rs/deploy-stats: the example plugin from the coolify-rs repository.
# Every published version is immutable; only `yanked` may change later. See README.md.

[[versions]]
version = "0.1.0"
source = "https://github.com/coolify-rs/coolify-rs"
commit = "9fe258c338e454c17a696d27d8472d814f6950ad"
toolchain = "rust 1.99.1, target wasm32-wasip2"
builder = "docker.io/library/rust:1.99.1-slim-bookworm@sha256:f2c004e3d2d8b547e8cf7ffbc29205385f4e71d23e53e4e383065db5e9f822cd"
# PLACEHOLDER from a local (macOS) build of the commit. The builder image's build will differ: replace this
# with the hash the first CI rebuild prints, and publish that build at `url`, before this entry is merged.
sha256 = "529645ea5a65d534277a0c32e45e4a0a8f477ddbc4398cd5a45e4f73c665b3c6"
url = "https://github.com/coolify-rs/coolify-rs/releases/download/deploy-stats-v0.1.0/deploy_stats.wasm"

[versions.build]
dir = "plugins"
command = "rustup target add wasm32-wasip2 && cargo build --release --locked --target wasm32-wasip2 -p deploy-stats"
artifact = "target/wasm32-wasip2/release/deploy_stats.wasm"

[versions.manifest]
id = "coolify-rs/deploy-stats"
name = "Deploy stats"
version = "0.1.0"
description = "Counts successful and failed deployments per team and serves the totals."
license = "Apache-2.0"
source = "https://github.com/coolify-rs/coolify-rs/tree/main/plugins/examples/deploy-stats"
api = "0.1"

[versions.manifest.capabilities]
events = ["deployment.succeeded", "deployment.failed"]
storage = true
routes = true
