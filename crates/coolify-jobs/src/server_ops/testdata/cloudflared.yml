services:
  coolify-cloudflared:
    container_name: coolify-cloudflared
    image: 'cloudflare/cloudflared:latest'
    restart: unless-stopped
    network_mode: host
    command: 'tunnel run'
    environment:
      - TUNNEL_TOKEN=abc
      - 'TUNNEL_METRICS=127.0.0.1:60123'
    healthcheck:
      test:
        - CMD
        - cloudflared
        - tunnel
        - '--metrics'
        - '127.0.0.1:60123'
        - ready
      interval: 5s
      timeout: 30s
      retries: 5
      start_period: 120s
