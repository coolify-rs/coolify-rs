# gitleaks with its default rules, minus findings reviewed as not secret.
[extend]
useDefault = true

[allowlist]
description = "Reviewed: test fixtures, resource UUIDs and placeholder keys"
paths = [
  # Output captured from the throwaway reference instance: resource UUIDs and Supabase demo JWTs
  # signed with that instance's generated secret.
  '''^crates/coolify-jobs/tests/fixtures/''',
  # SSH keys generated only to test key parsing and fingerprints; they open nothing.
  '''^crates/coolify-compat/tests/fixtures/''',
  # Placeholder PEM blocks used to test redaction and key parsing.
  '''^crates/coolify-compat/src/redact\.rs$''',
  '''^crates/coolify-compat/src/sshkey\.rs$''',
  '''^crates/coolify-jobs/src/server_ops/certificate\.rs$''',
  '''^crates/coolify-remote/tests/fake_ssh\.rs$''',
  # The plugin registry's development signing key: public on purpose, never trusted by default.
  '''^crates/coolify-plugins/tests/fixtures/registry-dev\.key$''',
]
# The UUID of the private key record the differential scripts use (an id, not key material), and
# sha256("abc"), the published SHA-256 test vector, used as an expected hash in tests.
# Commits whose findings were reviewed as test placeholders: 88e6428e has a placeholder PEM block
# (body "abc", no key material) in a test of crates/coolify-jobs/src/databases/env.rs.
commits = ['''88e6428ead73c0120f6e04556bccb41738f0f64a''']
regexes = [
  '''hv41morfjv9x0av5kakzdmv8''',
  '''ba7816bf8f01cfea414140de5dae2223b00361a396177a9cb410ff61f20015ad''',
]
