[package]
name = "deploy-chains"
description = "First-party coolify-rs plugin: deploys an application's dependents after it deploys successfully."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# `cdylib` is the component; `rlib` lets `cargo test` run the rules' logic natively (src/chain.rs), without
# the plugin interface, which only exists in WebAssembly.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde.workspace = true
serde_json.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
coolify-rs-plugin.workspace = true
