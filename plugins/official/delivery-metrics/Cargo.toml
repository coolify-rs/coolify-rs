[package]
name = "delivery-metrics"
description = "First-party coolify-rs plugin: the four DORA metrics per team and per application, with CSV exports."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# cdylib is the component; rlib lets `cargo test` run the plain functions on the host.
crate-type = ["cdylib", "rlib"]

[dependencies]
serde.workspace = true
serde_json.workspace = true

# The SDK's bindings only exist on WebAssembly; everything else builds and is tested natively.
[target.'cfg(target_arch = "wasm32")'.dependencies]
coolify-rs-plugin.workspace = true
