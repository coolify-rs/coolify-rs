# Plugins build for WebAssembly (`--target wasm32-wasip2`), so they are a workspace of their own.
#   cd plugins && cargo build --release --target wasm32-wasip2
[workspace]
resolver = "3"
members = ["sdk-rust", "official/*", "examples/*", "testing/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
coolify-rs-plugin = { path = "sdk-rust" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wit-bindgen = "0.63"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
