id = "coolify-rs/deploy-board"
name = "Deploy board"
version = "0.1.0"
description = "Shows deployment counts on the dashboard and on each application's Plugins tab."
license = "Apache-2.0"
source = "https://github.com/coolify-rs/coolify-rs/tree/main/plugins/examples/deploy-board"
# Version of the plugin interface (crates/coolify-plugins/wit/plugin.wit) the component targets.
api = "0.1"

[capabilities]
events = ["deployment.succeeded", "deployment.failed"]
storage = true
routes = true

[[capabilities.ui]]
slot = "dashboard"
title = "Deployments"
path = "/panels/dashboard"

[[capabilities.ui]]
slot = "application"
title = "Deployments"
path = "/panels/application"
